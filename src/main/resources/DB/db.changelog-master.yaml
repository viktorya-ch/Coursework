databaseChangeLog:
  -changeSet:
    id: create-dynamic-rule-table
    author: dev
    changes:
      -createTable:
        tableName: dynamic_rule
        columns:
          name: id
          type: UUID
          constraints:
          primaryKey: true
          -column:
            name: product_name
            type: VARCHAR(255)
            constraints:
            nullable: false
            -column:
              name: product_id
              type: UUID
              constraints:
              nullable: false
              -column:
                name: product_text
                type: TEXT
                constraints:
                nullable: false
                -column:
                  name: rule
                  type: JSONB
                  constraints:
                  nullable: false
